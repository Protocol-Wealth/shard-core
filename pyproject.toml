[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shard-core"
version = "0.2.0"
description = "Authenticated local encryption and Shamir threshold recovery with offline workflows."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Protocol Wealth LLC" }]
license = "Apache-2.0 OR MIT-0"
license-files = ["LICENSE", "LICENSE-MIT-0"]
keywords = [
  "shamir",
  "secret-sharing",
  "encryption",
  "aead",
  "disaster-recovery",
  "fordefi",
  "slip39",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security :: Cryptography",
  "Environment :: Console",
  "Operating System :: OS Independent",
]
dependencies = ["pycryptodome>=3.20"]

[project.optional-dependencies]
# SLIP-39 word-list shares (Trezor reference libs). Install: pip install 'shard-core[slip39]'
slip39 = ["shamir-mnemonic>=0.3.0", "mnemonic>=0.20"]
# Test coverage includes the optional SLIP-39 implementation.
test = [
  "shamir-mnemonic>=0.3.0",
  "mnemonic>=0.20",
  "packaging>=26.2",
]
# Release tooling is intentionally separate from runtime dependencies.
dev = [
  "shamir-mnemonic>=0.3.0",
  "mnemonic>=0.20",
  "build>=1.2",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://protocolwealthllc.com/opensource/encryption"
Documentation = "https://protocolwealthllc.com/opensource/encryption"
Repository = "https://github.com/Protocol-Wealth/shard-core"
Issues = "https://github.com/Protocol-Wealth/shard-core/issues"
Changelog = "https://github.com/Protocol-Wealth/shard-core/blob/main/CHANGELOG.md"
Security = "https://github.com/Protocol-Wealth/shard-core/security/policy"

[project.scripts]
shard-core = "shard_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
