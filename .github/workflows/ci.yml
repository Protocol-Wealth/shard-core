name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install hash-locked test dependencies
        run: >-
          python -m pip install --require-hashes
          -r release/ci-requirements.txt
      - name: Unit tests including SLIP-39
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Optimized-mode unit tests
        run: python -O -m unittest discover -s tests -v
        env:
          PYTHONPATH: src

  package:
    name: build + static + clean smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install hash-locked build and runtime dependencies
        run: |
          python -m pip install --require-hashes \
            -r release/build-requirements.txt \
            -r release/ci-requirements.txt
      - name: Focused static checks
        run: python -m compileall -q src tests scripts
      - name: Build wheel
        run: python -m build --wheel --no-isolation
      - name: Install wheel into clean environment
        run: |
          python -m venv /tmp/shard-core-wheel-smoke
          /tmp/shard-core-wheel-smoke/bin/python -m pip install \
            --require-hashes -r release/ci-requirements.txt
          /tmp/shard-core-wheel-smoke/bin/python -m pip install \
            --no-deps dist/*.whl
      - name: Smoke (protect -> recover)
        run: |
          set -e
          SHARD_CORE=/tmp/shard-core-wheel-smoke/bin/shard-core
          "$SHARD_CORE" --version
          printf 'test-secret-value' > /tmp/s.txt
          "$SHARD_CORE" protect -t 2 -n 3 -i /tmp/s.txt -o /tmp/shards
          "$SHARD_CORE" recover -o /tmp/r.txt \
            /tmp/shards/share-01.txt /tmp/shards/share-03.txt
          diff /tmp/s.txt /tmp/r.txt
      - name: Smoke (Fordefi SHEN encrypt -> decrypt)
        env:
          SHARD_CORE_TEST_PASSPHRASE: synthetic-ci-passphrase
        run: |
          set -e
          SHARD_CORE=/tmp/shard-core-wheel-smoke/bin/shard-core
          printf '%s\n' \
            'alpha bravo charlie delta echo foxtrot golf hotel india juliet kilo lima' \
            > /tmp/fordefi-phrase.txt
          chmod 0600 /tmp/fordefi-phrase.txt
          "$SHARD_CORE" fordefi encrypt \
            --phrase-file /tmp/fordefi-phrase.txt \
            --passphrase-env SHARD_CORE_TEST_PASSPHRASE \
            --scrypt-n 10 \
            --output /tmp/fordefi-phrase.shen
          "$SHARD_CORE" fordefi decrypt \
            --input /tmp/fordefi-phrase.shen \
            --passphrase-env SHARD_CORE_TEST_PASSPHRASE \
            --output /tmp/fordefi-recovered.txt
          test "$(cat /tmp/fordefi-phrase.txt)" = \
            "$(cat /tmp/fordefi-recovered.txt)"
      - name: Smoke (SLIP-39 split -> combine)
        run: |
          set -e
          SHARD_CORE=/tmp/shard-core-wheel-smoke/bin/shard-core
          "$SHARD_CORE" slip39 split -t 2 -n 3 \
            --hex 000102030405060708090a0b0c0d0e0f -o /tmp/s39
          OUT=$("$SHARD_CORE" slip39 combine --stdout --hex \
            /tmp/s39/share-01.txt /tmp/s39/share-03.txt)
          test "$OUT" = "000102030405060708090a0b0c0d0e0f"

  stage6-contract:
    name: Stage 6 offline bundle contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install hash-locked test dependencies
        run: >-
          python -m pip install --require-hashes
          -r release/ci-requirements.txt
      - name: Assert canonical Python builder entrypoint
        run: |
          python scripts/build-offline-bundle.py --help
          python -m py_compile \
            scripts/build-offline-bundle.py \
            scripts/container-build-wheel.py \
            scripts/fetch-reviewed-wheels.py \
            scripts/release_support.py \
            scripts/validate-release-wheels.py
          python -m unittest tests.test_stage6_builder_boundary -v
      - name: Assert release path boundaries
        run: |
          if bash scripts/build-offline-bundle.sh 2>legacy-builder.err; then
            echo "legacy builder unexpectedly succeeded" >&2
            exit 1
          fi
          grep -F "permanently disabled" legacy-builder.err
          if bash install.sh 2>source-installer.err; then
            echo "source dispatcher unexpectedly found a bundle" >&2
            exit 1
          fi
          grep -F "no offline bundle found" source-installer.err
      # Hosted CI is test evidence, not candidate provenance. A real OCI smoke
      # uses the controlled rootless Podman account, pinned configuration tree,
      # immutable storage roots, and approved local executable/image digests.
