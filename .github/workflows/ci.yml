name: CI

# Immutable action commits are pinned to SHAs recorded by official GitHub runner logs.
# Independently verify them against upstream before the final 0.2.0 release.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install declared test dependencies
        run: python -m pip install '.[test]'
      - name: Unit tests including SLIP-39
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Optimized-mode unit tests
        run: python -O -m unittest discover -s tests -v
        env:
          PYTHONPATH: src

  package:
    name: build + static + clean smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Install declared development dependencies
        run: python -m pip install '.[dev]'
      - name: Focused static checks
        run: |
          python -m compileall -q src tests
          ruff check --select E9,F63,F7,F82 .
      - name: Build wheel
        run: python -m build --wheel
      - name: Install wheel into clean environment
        run: |
          python -m venv /tmp/shard-core-wheel-smoke
          /tmp/shard-core-wheel-smoke/bin/python -m pip install dist/*.whl
      - name: Smoke (protect -> recover)
        run: |
          set -e
          SHARD_CORE=/tmp/shard-core-wheel-smoke/bin/shard-core
          "$SHARD_CORE" --version
          printf 'test-secret-value' > /tmp/s.txt
          "$SHARD_CORE" protect -t 2 -n 3 -i /tmp/s.txt -o /tmp/shards
          "$SHARD_CORE" recover -o /tmp/r.txt /tmp/shards/share-01.txt /tmp/shards/share-03.txt
          diff /tmp/s.txt /tmp/r.txt
          echo "base smoke OK"
      - name: Smoke (SLIP-39 split -> combine)
        run: |
          set -e
          SHARD_CORE=/tmp/shard-core-wheel-smoke/bin/shard-core
          /tmp/shard-core-wheel-smoke/bin/python -m pip install 'shard-core[slip39]' --find-links dist
          "$SHARD_CORE" slip39 split -t 2 -n 3 --hex 000102030405060708090a0b0c0d0e0f -o /tmp/s39
          OUT=$("$SHARD_CORE" slip39 combine --stdout --hex /tmp/s39/share-01.txt /tmp/s39/share-03.txt)
          test "$OUT" = "000102030405060708090a0b0c0d0e0f"
          echo "slip39 smoke OK"

  stage6-contract:
    name: Stage 6 canonical candidate contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install declared test dependencies
        run: python -m pip install '.[test]'
      - name: Assert canonical Python builder entrypoint
        run: |
          python scripts/build-offline-bundle.py --help
          python -m py_compile \
            scripts/build-offline-bundle.py \
            scripts/container-build-wheel.py \
            scripts/fetch-reviewed-wheels.py \
            scripts/release_support.py \
            scripts/validate-release-wheels.py
          python -m unittest tests.test_stage6_builder_boundary -v
      - name: Assert legacy release paths fail closed
        run: |
          if bash scripts/build-offline-bundle.sh; then
            echo "legacy builder unexpectedly succeeded" >&2
            exit 1
          fi
          if bash install.sh; then
            echo "source-tree installer unexpectedly succeeded" >&2
            exit 1
          fi
      # A real OCI smoke test is intentionally not claimed by hosted CI.
      # It requires the dedicated ceremony account and independently approved
      # local executable, configuration, storage, and image digests.
