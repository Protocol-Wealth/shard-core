name: Publish to PyPI

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Immutable stable release tag, for example v0.2.0"
        required: true
        type: string

jobs:
  build:
    name: build distributions without OIDC
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install hash-locked build tools
        run: >-
          python -m pip install --require-hashes
          -r release/build-requirements.txt
      - name: Verify immutable stable version identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python scripts/validate-release-tag.py \
            --tag "$RELEASE_TAG" \
            --pyproject pyproject.toml
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
      - name: Build distributions
        run: python -m build --no-isolation
      - name: Validate distribution inventory and clean install
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION=${RELEASE_TAG#v}
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          test -f "dist/shard_core-${VERSION}-py3-none-any.whl"
          test -f "dist/shard_core-${VERSION}.tar.gz"
          python -m venv /tmp/shard-core-pypi-smoke
          /tmp/shard-core-pypi-smoke/bin/python -m pip install \
            --require-hashes -r release/ci-requirements.txt
          /tmp/shard-core-pypi-smoke/bin/python -m pip install \
            --no-deps "dist/shard_core-${VERSION}-py3-none-any.whl"
          /tmp/shard-core-pypi-smoke/bin/python -m pip check
          test "$(/tmp/shard-core-pypi-smoke/bin/shard-core --version)" = \
            "shard-core ${VERSION}"
      - name: Transfer validated distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4 reviewed 2026-07-25
        with:
          name: pypi-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish trusted release
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/shard-core
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Retrieve validated distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4 reviewed 2026-07-25
        with:
          name: pypi-distributions
          path: dist/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 reviewed 2026-07-25
