name: Publish to PyPI

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Immutable stable release tag, for example v0.2.0"
        required: true
        type: string

jobs:
  build:
    name: build distributions without OIDC
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install hash-locked build tools
        run: >-
          python -m pip install --require-hashes
          -r release/build-requirements.txt
      - name: Verify immutable stable version identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python scripts/validate-release-tag.py \
            --tag "$RELEASE_TAG" \
            --pyproject pyproject.toml
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
      - name: Build distributions
        run: python -m build --no-isolation
      - name: Validate distribution inventory and clean install
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION=${RELEASE_TAG#v}
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          test -f "dist/shard_core-${VERSION}-py3-none-any.whl"
          test -f "dist/shard_core-${VERSION}.tar.gz"
          python -m venv /tmp/shard-core-pypi-smoke
          /tmp/shard-core-pypi-smoke/bin/python -m pip install \
            --require-hashes -r release/ci-requirements.txt
          /tmp/shard-core-pypi-smoke/bin/python -m pip install \
            --no-deps "dist/shard_core-${VERSION}-py3-none-any.whl"
          /tmp/shard-core-pypi-smoke/bin/python -m pip check
          test "$(/tmp/shard-core-pypi-smoke/bin/shard-core --version)" = \
            "shard-core ${VERSION}"
      - name: Transfer validated distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 reviewed 2026-07-25
        with:
          name: pypi-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish trusted release
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/shard-core
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Retrieve validated distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 reviewed 2026-07-25
        with:
          name: pypi-distributions
          path: dist/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1 reviewed 2026-07-25
